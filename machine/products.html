<!-- A reload lands at the top. /chat, /snapshot and /path are pushState views of
     this one document, so the browser's restored scroll offset belongs to a view
     that no longer exists — it drops the visitor into the middle of a page they
     have not seen build. Set before first paint; a real #hash still wins. -->
<script>try{if('scrollRestoration' in history)history.scrollRestoration='manual';}catch(e){}</script>

<!-- The order mirrors machine/b.html's, for the same reasons: the engine owns
     the session and the data promise, so it goes first; the flow and research
     are pure logic with no DOM, so they only have to precede the shell that
     drives them; the snapshot needs its data builder; path.js is what the
     snapshot hands off to. product-chat.js is this page's conversation shell
     (b.html's convo.js is the landing's — see the note at the top of that
     file), and it is loaded BEFORE solution.js because solution.js mounts the
     panel as soon as the JSON resolves. console.js observes and loads last. -->
<script src="/machine/data-loader.js"></script>
<script src="/machine/engine.js"></script>
<!-- "arrived from {campaign} ad" — renders only for a campaign the JSON knows -->
<script src="/machine/ribbon.js"></script>
<script src="/machine/flow.js"></script>
<script src="/machine/research.js"></script>
<script src="/machine/snapshot-data.js"></script>
<script src="/machine/snapshot.js"></script>
<script src="/machine/path.js"></script>
<!-- lead.js before solution.js: the [data-cta] handler checks for SAILEAD -->
<script src="/machine/lead.js"></script>
<script src="/machine/products.js"></script>
<script src="/machine/directory.js"></script>
<!-- S6 · the demo aid: observer only, loads last, never emits -->
<script src="/machine/console.js"></script>
