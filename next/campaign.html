<script>
/* theme, before first paint: a stored choice wins; otherwise the system
   preference, so a phone set to dark lands in dark. */
(function(){var d=document.documentElement,t=null;
try{t=localStorage.getItem('sw-theme');}catch(e){}
if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){t='light';}}
d.setAttribute('data-theme',t);})();
</script>
