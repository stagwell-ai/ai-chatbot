<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon source — screenshot body at each size</title>
<style>
  /* Brand V3.1 mark (from StagwellAI - Logo - Dark Background.svg) on the dark
     room tile. Rendered at 512, 192, 180 and 32. The tile lives on a wrapper —
     a body background propagates to the canvas and its border-radius is ignored. */
  *{margin:0}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}
  .wrap{width:100%;height:100%;display:grid;place-items:center}
  .wrap.tile{background:#071A24;border-radius:18%}
  svg{width:66%;height:66%}
</style>
</head>
<body>
  <div class="wrap">
  <svg viewBox="0 0 158.2 153" xmlns="http://www.w3.org/2000/svg">
    <path d="M93.1156 110.812H0V152.999H68.5964C83.69 152.999 93.1156 143.575 93.1156 128.483V110.812Z" fill="white"/>
    <path d="M65.0454 42.2235H158.161V0H89.5529C74.471 0 65.0454 9.42489 65.0454 24.5169V42.2235Z" fill="#FFB81C"/>
    <path d="M0 97.6127H133.665C148.747 97.6127 158.185 88.1881 158.185 73.1079V55.4258H24.5195C9.4259 55.4258 0 64.8504 0 79.9429V97.6127Z" fill="#009CBD"/>
  </svg>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('tile') === '1') document.querySelector('.wrap').classList.add('tile');
    // untiled (transparent) use: the white bar would vanish on a light tab — navy it
    else document.querySelector('path[fill="white"]').setAttribute('fill', '#003349');
    if (q.get('r') === '0') document.querySelector('.wrap').style.borderRadius = '0';
  </script>
</body>
</html>
